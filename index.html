<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
  .a1s-app-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(circle at top, #1c1514 0%, #09090b 60%, #050505 100%); color: #fff; }
  .a1s-app-loader__card { width: min(92vw, 320px); padding: 26px 24px; border: 1px solid rgba(255,255,255,.12); border-radius: 20px; background: rgba(8,8,11,.86); box-shadow: 0 24px 70px rgba(0,0,0,.35); text-align: center; }
  .a1s-app-loader__ring { width: 42px; height: 42px; margin: 0 auto 12px; border-radius: 50%; border: 3px solid rgba(255,255,255,.16); border-top-color: var(--a1s-red); animation: a1s-spin .9s linear infinite; }
  @keyframes a1s-spin { to { transform: rotate(360deg); } }
  h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
  p { text-wrap: pretty; }
  a { -webkit-tap-highlight-color: transparent; }
  ::selection { background: var(--a1s-red); color: #fff; }
  :focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }
  img, svg { max-width: 100%; }

  /* ── Cursor walkie-talkie: ocultar nativo cuando está activo ── */
  html.a1s-cursor-on, html.a1s-cursor-on * { cursor: none !important; }
  #a1s-cursor-ring {
    position: fixed; left: -100px; top: -100px; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border: 2px solid var(--a1s-red); border-radius: 50%; pointer-events: none; z-index: 2147483645; opacity: 0;
  }
  #a1s-cursor-ring.go { animation: a1s-ring .55s var(--ease-out); }
  @keyframes a1s-ring { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(3.4); } }

  /* ── Cortina de transición de ruta ── */
  .a1s-wipe { position: fixed; inset: 0; z-index: 95; pointer-events: none; background: var(--a1s-red);
    transform: scaleY(0); transform-origin: bottom; }
  .a1s-wipe.go { animation: a1s-wipe .76s cubic-bezier(.76,0,.24,1) forwards; }
  .a1s-wipe-dot { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px; border-radius: 50%; background: #fff; opacity: 0; }
  .a1s-wipe.go .a1s-wipe-dot { animation: a1s-wipedot .76s ease forwards; }
  @keyframes a1s-wipe { 0% { transform: scaleY(0); transform-origin: bottom; } 45% { transform: scaleY(1); transform-origin: bottom; } 55% { transform: scaleY(1); transform-origin: top; } 100% { transform: scaleY(0); transform-origin: top; } }
  @keyframes a1s-wipedot { 0%,20% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } 80%,100% { opacity: 0; transform: scale(2.2); } }

  /* ── Entrada de ruta (solo transform; nunca oculta el contenido) ── */
  .a1s-route { animation: a1s-routein .45s var(--ease-out); }
  @keyframes a1s-routein { from { transform: translateY(10px); } to { transform: none; } }
  /* Entrada de bloques: solo transform (el contenido nunca queda oculto) */
  @keyframes a1s-rise { from { transform: translateY(22px); } to { transform: none; } }

  /* ── Cierre dividido Clientes | Talento ── */
  .a1s-final-half .a1s-final-cta { transition: gap .3s var(--ease-out); }
  .a1s-final-half { transition: filter .3s var(--ease-standard); }
  .a1s-final-half:hover { filter: brightness(1.1); }
  .a1s-final-half:hover .a1s-final-img { transform: scale(1.06) !important; opacity: .82 !important; }
  .a1s-final-half:hover .a1s-final-cta { gap: 16px; }
  @media (max-width: 760px) { .a1s-split-final { grid-template-columns: 1fr !important; } }

  /* ── Hero inmersivo ── */
  @keyframes a1s-breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.012); } }
  .a1s-breathe { animation: a1s-breathe 7s ease-in-out infinite; transition: transform .25s var(--ease-out); }
  .a1s-hero-stats [style*="tabular-nums"] { text-shadow: 0 0 26px rgba(255,80,60,.45); }
  .a1s-hero-copy { position: relative; z-index: 8; width: 100%; }
  .a1s-hero-copy h1 { text-shadow: 0 4px 16px rgba(20,3,2,.45), 0 16px 48px rgba(20,3,2,.35); }
  .a1s-hero-copy .a1s-hero-actions { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
  @media (max-width: 980px) {
    .a1s-hero-copy { max-width: 86% !important; }
  }
  @media (max-width: 760px) {
    .a1s-hero-copy { max-width: 100% !important; padding-right: 0; }
    .a1s-hero-copy h1 { font-size: clamp(2.35rem, 8.6vw, 3.2rem) !important; line-height: .95 !important; letter-spacing: -.025em !important; text-shadow: 0 4px 16px rgba(20,3,2,.45), 0 12px 30px rgba(20,3,2,.35); }
    .a1s-hero-copy p { font-size: 1rem !important; line-height: 1.6 !important; max-width: 100% !important; }
    .a1s-hero-copy .a1s-hero-actions { margin-top: 24px !important; gap: 10px !important; flex-direction: column !important; align-items: flex-start !important; }
    .a1s-breathe { opacity: .22 !important; right: -28% !important; height: 70% !important; }
    .a1s-hero-stats { gap: 1.4rem 1.8rem !important; }
  }

  /* ── Indicadores visuales desactivados ── */
  .a1s-scan, .a1s-rec, .a1s-ping, .a1s-radar-sweep { display: none !important; }

  /* ── Scroll cue ── */
  .a1s-scrollcue { width: 22px; height: 34px; border: 1.5px solid var(--dark-muted); border-radius: 12px; position: relative; flex: none; }
  .a1s-scrollcue::after { content: ''; position: absolute; left: 50%; top: 6px; width: 3px; height: 7px; margin-left: -1.5px; border-radius: 2px; background: var(--a1s-red); animation: a1s-cue 1.6s ease-in-out infinite; }
  @keyframes a1s-cue { 0%,100% { transform: translateY(0); opacity: 1; } 60% { transform: translateY(12px); opacity: .2; } }

  /* ── Timeline de pasos ── */
  .a1s-steps-line { position: absolute; top: 27px; left: 28px; right: 28px; height: 2px;
    background: linear-gradient(90deg, var(--a1s-red), color-mix(in srgb, var(--a1s-red) 20%, transparent)); opacity: .4; }

  /* ── Marquee de clientes ── */
  .a1s-marquee { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
  .a1s-marquee-track { display: flex; gap: 56px; width: max-content; animation: a1s-marquee 26s linear infinite; }
  .a1s-marquee-track.still { animation: none; }
  @keyframes a1s-marquee { to { transform: translateX(-50%); } }
  .a1s-logo { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .04em; color: var(--gray-300);
    filter: grayscale(1); transition: color .25s; white-space: nowrap; padding: 12px 0; }
  .a1s-logo:hover { color: var(--a1s-red); }


  /* ── Static (animaciones off) ── */
  html.a1s-static .a1s-scan, html.a1s-static .a1s-rec, html.a1s-static .a1s-ping,
  html.a1s-static .a1s-radar-sweep, html.a1s-static .a1s-scrollcue::after,
  html.a1s-static .a1s-marquee-track, html.a1s-static .a1s-route { animation: none !important; }

  /* ── Responsive ── */
  .a1s-burger { display: none; }
  @media (max-width: 760px) {
    :root { --gutter: 20px; }
    body { font-size: 15px; }
    .a1s-hero-copy { max-width: 100% !important; }
    .a1s-hero-copy h1 { font-size: clamp(2.2rem, 8vw, 3rem) !important; line-height: .98 !important; }
    .a1s-hero-copy p { font-size: 1rem !important; line-height: 1.58 !important; }
    .a1s-hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 1rem 1.1rem !important; width: 100% !important; max-width: none !important; }
    .a1s-breathe { opacity: .24 !important; right: -32% !important; height: 72% !important; }
  }
  @media (max-width: 1024px) {
    .a1s-stats { grid-template-columns: repeat(3, 1fr) !important; gap: 28px 18px !important; }
    .a1s-proc { grid-template-columns: repeat(2, 1fr) !important; }
    .a1s-grid3 { grid-template-columns: repeat(2, 1fr) !important; }
    .a1s-steps { grid-template-columns: repeat(2, 1fr) !important; gap: 36px 28px !important; }
    .a1s-steps-line { display: none; }
  }
  @media (max-width: 860px) {
    .a1s-navlinks, .a1s-navcta { display: none !important; }
    .a1s-burger { display: inline-flex !important; margin-left: auto; }
    .a1s-split { grid-template-columns: 1fr !important; }
    .a1s-bifurc { grid-template-columns: 1fr !important; }
    .a1s-vac-grid { grid-template-columns: 1fr !important; }
    .a1s-grid3 { grid-template-columns: 1fr !important; }
    .a1s-foot-grid { grid-template-columns: 1fr 1fr !important; }
    .a1s-foot-reg { grid-template-columns: repeat(2, 1fr) !important; }
    .a1s-form { grid-template-columns: 1fr !important; }
    .a1s-split [style*="sticky"] { position: static !important; }
  }
  @media (max-width: 560px) {
    .a1s-stats { grid-template-columns: repeat(2, 1fr) !important; }
    .a1s-proc { grid-template-columns: 1fr !important; }
    .a1s-steps { grid-template-columns: 1fr !important; }
    .a1s-foot-reg { grid-template-columns: 1fr !important; }
  }
</style>
