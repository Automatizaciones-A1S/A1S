services:
  web:
    build: .
    container_name: a1s-web
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: a1s-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
